name: Production-APK veroeffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Signierte Production-APK bauen und veroeffentlichen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36"

      - name: Release-Signatur vorbereiten
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for variable in SIGNING_KEY KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              missing+=("${variable}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Fehlende Production-Secrets: ${missing[*]}" >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${keystore}"
          echo "RELEASE_STORE_FILE=${keystore}" >> "${GITHUB_ENV}"
          echo "RELEASE_STORE_PASSWORD=${KEY_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Production-APK bauen
        run: ./gradlew --no-daemon clean assembleRelease

      - name: APK pruefen und benennen
        id: package
        shell: bash
        run: |
          version="2.0.${GITHUB_RUN_NUMBER}"
          source_apk="app/build/outputs/apk/release/app-release.apk"
          apk_name="skib-${version}.apk"
          test -f "${source_apk}"
          apksigner verify --verbose "${source_apk}"
          cp "${source_apk}" "${RUNNER_TEMP}/${apk_name}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${RUNNER_TEMP}/${apk_name}" >> "${GITHUB_OUTPUT}"

      - name: APK als Workflow-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: skib-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error

      - name: GitHub Production-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
        run: |
          gh release create "v${VERSION}" "${APK_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "SKIB ${VERSION}" \
            --notes "Automatisch aus Commit ${GITHUB_SHA} auf main erstellt." \
            --latest
